name: Library SQLite remote rehearsal
on:
  push:
    branches: ['library-sqlite-request/**']
    paths: ['editorial/requests/library-request.json']
permissions:
  contents: read
concurrency:
  group: library-sqlite-request-${{ github.ref }}
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/library-modular-integration-20261126
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read only request data and pin library source
        shell: bash
        run: |
          set -euo pipefail
          slug="${GITHUB_REF_NAME#library-sqlite-request/}"
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{0,47}$ ]]
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:editorial/requests/library-request.json" > "$RUNNER_TEMP/request.json"
          node -e 'const fs=require("fs"),a=require("node:assert/strict"),r=JSON.parse(fs.readFileSync(process.argv[1]));a.equal(r.mode,"query");a(["sqlite","find","inspect","select","gaps","inventory"].includes(r.command))' "$RUNNER_TEMP/request.json"
          echo "REQUEST_KEY=$slug-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node scripts/library-request-source.cjs prepare "$RUNNER_TEMP/modules" > "$RUNNER_TEMP/source.json"
          echo "MODULES_DIR=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).directory' "$RUNNER_TEMP/source.json")" >> "$GITHUB_ENV"
      - name: Execute read-only query
        shell: bash
        run: |
          set -euo pipefail
          node scripts/library-request-source.cjs query "$MODULES_DIR" "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/raw-result.json"
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1]));r.source_commit=process.env.SOURCE_COMMIT;r.source_ref="refactor/library-modular-integration-20261126";r.scope="integration_snapshot_not_live_main";r.request_commit=process.env.GITHUB_SHA;fs.writeFileSync(process.argv[2],JSON.stringify(r,null,2)+"\n",{flag:"wx"})' "$RUNNER_TEMP/raw-result.json" "$RUNNER_TEMP/result.json"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: library-sqlite-result
          path: ${{ runner.temp }}/result.json
          retention-days: 14
      - name: Publish only compact report to isolated result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          out="refs/heads/library-sqlite-result/$REQUEST_KEY"
          [ -z "$(git ls-remote origin "$out")" ] || { echo 'Result exists'; exit 1; }
          blob=$(git hash-object -w "$RUNNER_TEMP/result.json")
          tree=$(printf '100644 blob %s\tresult.json\n' "$blob" | git mktree)
          commit=$(printf 'Read-only SQLite request %s on integration %s\n' "$GITHUB_SHA" "$SOURCE_COMMIT" | git commit-tree "$tree")
          git push origin "$commit:$out"
