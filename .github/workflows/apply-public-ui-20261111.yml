name: Apply approved watercolor UI to public Pages
on:
  push:
    branches: [gh-pages]
    paths:
      - 'release/ui-20261111/**'
      - 'scripts/install-public-ui-20261111.cjs'
      - '.github/workflows/apply-public-ui-20261111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and install UI without changing the public word library
        run: node scripts/install-public-ui-20261111.cjs
      - name: Commit only the published game shell and visual resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish blue and lavender watercolor GUI, fullscreen layout and neutral motion'
            git push origin HEAD:gh-pages
          else
            echo 'Published game shell is already current'
          fi