name: Link WebP assets in published demo library

on:
  push:
    paths:
      - '.github/workflows/link-published-assets.yml'
      - 'scripts/link-published-assets.cjs'
      - 'assets/words/*.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-image-links-main
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update only existing published library image URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/link-published-assets.cjs
            git add library.json
            if git diff --cached --quiet; then
              echo "No published image URLs need migration"
              exit 0
            fi
            git commit -m "Use published compressed WebP image assets"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
