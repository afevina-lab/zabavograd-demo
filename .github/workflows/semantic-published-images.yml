name: Link and rename all 181 published images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-public-image-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=11,<13"
      - name: Rename, shrink and relink public images and scale image bounds
        run: |
          python source/scripts/semantic-published-images.py site
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -A assets/words library.json
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Use descriptive compressed word images in published library"
            git -C site push origin HEAD:gh-pages
          fi
      - name: Mirror only published library data into public default branch
        run: |
          git -C source fetch origin main
          git -C source reset --hard origin/main
          cp site/library.json source/library.json
          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source add library.json
          if ! git -C source diff --cached --quiet; then
            git -C source commit -m "Keep public source library image links aligned with gh-pages"
            git -C source push origin HEAD:main
          fi
