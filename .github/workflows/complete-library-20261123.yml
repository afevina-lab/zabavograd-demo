name: Complete approved library gaps, forms and semantic relations

on:
  push:
    branches: [codex/library-gaps-forms-20261123]
    paths:
      - '.github/workflows/complete-library-20261123.yml'
      - 'scripts/publish-editorial-gaps-20261123.cjs'
      - 'scripts/extend-morphology-20261123.py'
      - 'scripts/activate-safe-forms-20261123.py'
      - 'scripts/data/relation-draft-20261123.json'
      - 'scripts/semantic-review.cjs'
      - 'scripts/export-library.cjs'
      - 'tests/editorial-gaps-published.test.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-editorial-library-20261123
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical build tools, never bundle them for the game
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          python -m pip install pymorphy3==2.0.6
      - name: Add missing educational words and verified original semantic facts
        run: node scripts/publish-editorial-gaps-20261123.cjs
      - name: Generate exact local inflections without overwriting manual forms
        run: python scripts/extend-morphology-20261123.py --write
      - name: Admit only conservative reproducible forms
        run: python scripts/activate-safe-forms-20261123.py
      - name: Validate stable IDs and semantic invariants
        run: |
          npm run check:library
          npm run library:refresh
          node scripts/check-library-preview.cjs
          node scripts/verify-consolidated-library.cjs
      - name: Test active runtime forms and typed semantic graph
        run: |
          npm test
          node scripts/check-offline-release.cjs dist || true
          npm run check:design-system
          npm run build
          node scripts/check-offline-release.cjs dist
      - name: Commit canonical source and generated offline game data on review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/library-v2.json outputs/EDITORIAL_GAPS_20261123.json outputs/GRAMMAR_FORMS_REVIEW_20261123.json outputs/ACTIVE_FORMS_20261123.json outputs/Библиотека.html library.json semantic-graph.json public/library.json public/semantic-graph.json public/grammar-frames.json
          if git diff --cached --quiet; then
            echo "No new canonical changes"
          else
            git commit -m "Approve educational vocabulary, semantic facts and machine-checked forms"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Retain concise audit reports
        uses: actions/upload-artifact@v4
        with:
          name: approved-library-audit-20261123
          path: |
            outputs/EDITORIAL_GAPS_20261123.json
            outputs/GRAMMAR_FORMS_REVIEW_20261123.json
            outputs/ACTIVE_FORMS_20261123.json
          retention-days: 30
          if-no-files-found: error
