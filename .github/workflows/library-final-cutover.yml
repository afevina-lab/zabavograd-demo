name: Final library cutover preparation
on:
  push:
    branches: [migration/library-canonical-20261127]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/migration/library-canonical-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm current main and immutable source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3eeca3100bc8aadafed64b21093bcb177d4e5036"
          test "$(git rev-parse HEAD:outputs/library-v2.json)" = "$(git rev-parse origin/main:outputs/library-v2.json)"
          git diff --exit-code origin/main HEAD -- src public/assets outputs/library-v2.json outputs/image-library.json
          node scripts/check-library-v2.cjs
          node scripts/sync-runtime.cjs
          sha256sum library.json semantic-graph.json public/library.json public/semantic-graph.json public/grammar-frames.json > "$RUNNER_TEMP/runtime-before.sha"
          cp outputs/library-v2.json "$RUNNER_TEMP/original-v2.json"
      - name: Convert exact current master and retire original
        shell: bash
        run: |
          set -euo pipefail
          node scripts/library-store.cjs init "$RUNNER_TEMP/original-v2.json" "$RUNNER_TEMP/modules"
          node scripts/library-store.cjs export "$RUNNER_TEMP/modules" "$RUNNER_TEMP/restored.json"
          node -e 'const a=require("node:assert/strict"),fs=require("fs");a.deepEqual(JSON.parse(fs.readFileSync(process.argv[1])),JSON.parse(fs.readFileSync(process.argv[2])));' "$RUNNER_TEMP/original-v2.json" "$RUNNER_TEMP/restored.json"
          mv "$RUNNER_TEMP/modules" outputs/library-modules
          git rm outputs/library-v2.json
          printf '%s\n' '{"version":1,"mode":"modules","directory":"outputs/library-modules"}' > editorial/library-source-mode.json
          node scripts/library-source.cjs info
          node scripts/check-library-v2.cjs
          node scripts/library-archive-guard.cjs
          npm run library:refresh
          sha256sum -c "$RUNNER_TEMP/runtime-before.sha"
          node scripts/check-library-preview.cjs
          node scripts/verify-consolidated-library.cjs
      - name: Adapt remaining test readers to selected canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('tests').glob('*.test.ts'):
              s=p.read_text()
              if 'library-v2.json' not in s: continue
              before=s
              s=s.replace("JSON.parse(readFileSync(new URL('../outputs/library-v2.json',import.meta.url),'utf8'))","canonicalLibrary()")
              s=s.replace("JSON.parse(fs.readFileSync('outputs/library-v2.json','utf8'))","canonicalLibrary()")
              s=s.replace("JSON.parse(readFileSync('outputs/library-v2.json','utf8'))","canonicalLibrary()")
              s=s.replace("read('outputs/library-v2.json')","canonicalLibrary()")
              if s!=before:
                  s="import {createRequire as createCanonicalRequire} from 'node:module';\nconst canonicalLibrary=()=>createCanonicalRequire(import.meta.url)('../scripts/library-source.cjs').readSource().db;\n"+s
                  p.write_text(s)
                  print('Adapted',p)
          PY
          git grep -n -F 'library-v2.json' -- tests scripts .github/workflows editor-service public/editor | cut -c1-250 > "$RUNNER_TEMP/legacy-references.txt" || true
          cat "$RUNNER_TEMP/legacy-references.txt"
      - name: Verify full project without the monolith
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
          npm run test:library-editor
          npm run check:design-system
          npm run build
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/prepare-card-skins.py dist
          node scripts/check-offline-release.cjs dist
          node scripts/build-library-index.cjs "$RUNNER_TEMP/canonical-index"
          node scripts/library-sqlite.cjs build "$RUNNER_TEMP/canonical.sqlite"
          sha256sum -c "$RUNNER_TEMP/runtime-before.sha"
          test ! -e outputs/library-v2.json
      - name: Commit verified canonical generation on migration branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3eeca3100bc8aadafed64b21093bcb177d4e5036"
          git rm .github/workflows/library-final-cutover.yml
          git add outputs/library-modules editorial/library-source-mode.json tests outputs/Библиотека.html library.json semantic-graph.json public/semantic-graph.json public/grammar-frames.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Activate verified modular source with identical game exports"
          git push origin HEAD:refs/heads/migration/library-canonical-20261127
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutover-audit
          path: |
            ${{ runner.temp }}/runtime-before.sha
            ${{ runner.temp }}/legacy-references.txt
          if-no-files-found: ignore
