name: Library remote requests
on:
  push:
    branches: ['library-request/**']
    paths: ['editorial/requests/library-request.json']
permissions:
  contents: read
concurrency:
  group: library-request-${{ github.ref }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main implementation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read request as data only
        shell: bash
        run: |
          set -euo pipefail
          slug="${GITHUB_REF_NAME#library-request/}"
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{0,47}$ ]]
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:editorial/requests/library-request.json" > "$RUNNER_TEMP/library-request.json"
          echo "REQUEST_KEY=$slug-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Execute bounded query or checked candidate
        run: node scripts/library-request.cjs "$RUNNER_TEMP/library-request.json" "$RUNNER_TEMP/library-result.json" --allow-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: library-result
          path: ${{ runner.temp }}/library-result.json
          retention-days: 14
      - name: Store report and candidate on isolated branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          blob=$(git hash-object -w "$RUNNER_TEMP/library-result.json")
          tree=$(printf '100644 blob %s\tresult.json\n' "$blob" | git mktree)
          report=$(printf 'Library request %s on %s\n' "$GITHUB_SHA" "$base" | git commit-tree "$tree")
          result_ref="refs/heads/library-result/$REQUEST_KEY"
          candidate_ref="refs/heads/library-candidate/$REQUEST_KEY"
          if [ -n "$(git ls-remote origin "$result_ref" "$candidate_ref")" ]; then
            echo 'Result/candidate already exists; use a new request commit' >&2; exit 1
          fi
          # Candidate must contain only the changed canonical source, never request files.
          if ! git diff --quiet; then
            [ "$(git diff --name-only)" = "outputs/library-v2.json" ]
            git fetch --no-tags --depth=1 origin main
            [ "$(git rev-parse FETCH_HEAD)" = "$base" ] || { echo 'Main moved; repeat query' >&2; exit 1; }
            git add outputs/library-v2.json
            git commit -m "Validated library request $REQUEST_KEY"
            git push --atomic origin "HEAD:$candidate_ref" "$report:$result_ref"
          else
            git push origin "$report:$result_ref"
          fi
