name: One-time historical machine analysis migration
on:
  push:
    branches: [migration/retire-machine-draft-20261127]
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/migration/retire-machine-draft-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture original runtime
        run: |
          mkdir -p "$RUNNER_TEMP/old-runtime"
          git fetch --no-tags --depth=1 origin 9dc237f81fd1cf6b239ccfb1f158424872e9ac56
          git show 9dc237f81fd1cf6b239ccfb1f158424872e9ac56:scripts/export-library.cjs > scripts/export-library-before-audit.cjs
          node scripts/export-library-before-audit.cjs
          rm scripts/export-library-before-audit.cjs
          cp public/library.json public/semantic-graph.json public/grammar-frames.json "$RUNNER_TEMP/old-runtime/"
      - name: Migrate canonical candidates and preserve unapproved residuals
        run: node migrate-machine-draft-once.cjs
      - name: Verify byte-for-byte runtime and strict checks
        run: |
          npm run check:library
          npm run library:refresh
          node scripts/check-library-preview.cjs
          node scripts/verify-consolidated-library.cjs
          for f in library.json semantic-graph.json grammar-frames.json; do
            cmp "public/$f" "$RUNNER_TEMP/old-runtime/$f"
          done
          cmp library.json "$RUNNER_TEMP/old-runtime/library.json"
          cmp semantic-graph.json "$RUNNER_TEMP/old-runtime/semantic-graph.json"
          node --experimental-strip-types --test tests/library-index.test.ts tests/library-store.test.ts tests/library-contract.test.ts
          node scripts/build-library-index.cjs "$RUNNER_TEMP/index-after"
          python -m py_compile scripts/build-analysis-view.py
      - name: Commit verified generation only to migration candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm migrate-machine-draft-once.cjs .github/workflows/one-time-machine-draft-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- outputs/library-modules outputs/library-v2-auto-analysis.json migrate-machine-draft-once.cjs .github/workflows/one-time-machine-draft-migration.yml
          git commit -m "Retire historical machine draft after exact runtime verification"
          git push origin HEAD:refs/heads/migration/retire-machine-draft-20261127
