name: Diagnose hairbrush R sound
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-runtime.cjs
      - run: node --experimental-strip-types --test tests/hairbrush-diagnostic.test.ts
