name: Visual architecture (no deployment)
on:
  push:
    branches: [visual/composition-architecture-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 953797fdc6969bbd3ae939e970ea57a2a596c619
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable reference once
        run: |
          npm install --no-package-lock --ignore-scripts
          python -m pip install --disable-pip-version-check pillow
          node scripts/sync-runtime.cjs
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build
          python scripts/prepare-card-skins.py dist
          printf '%s' '953797fdc6969bbd3ae939e970ea57a2a596c619' > source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-reference-build
          path: |
            dist/
            source.sha
          retention-days: 90
  baseline:
    needs: baseline-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theme: [neutral, forest, space]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: immutable-reference-build
      - name: Capture reference states
        env:
          UI_THEME: ${{ matrix.theme }}
        run: node scripts/capture-visual-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baseline-${{ matrix.theme }}
          path: |
            ui-smoke/
            source.sha
          retention-days: 90
  candidate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate boundaries and existing functionality
        run: |
          npm install --no-package-lock --ignore-scripts
          python -m pip install --disable-pip-version-check pillow
          python -m unittest discover -s tests -p visual_compare_test.py
          node scripts/check-architecture.cjs
          node scripts/check-visual-architecture.mjs
          node scripts/check-browser-syntax.cjs scripts/verify-visual-next-browser.mjs scripts/capture-visual-baseline.mjs
          node scripts/sync-runtime.cjs
          node scripts/check-library-v2.cjs
          node scripts/check-design-system.cjs
          node --experimental-strip-types --test tests/*.test.ts tests/*.test.mjs
          ./node_modules/.bin/tsc --noEmit
      - name: Build standalone replacement preview
        run: |
          ./node_modules/.bin/vite build --config vite.visual.config.mjs
          node scripts/check-visual-build-isolation.mjs dist-visual
          python scripts/prepare-card-skins.py dist-visual
          node scripts/check-offline-release.cjs dist-visual
      - uses: actions/upload-artifact@v4
        with:
          name: visual-next-build
          path: dist-visual/
          retention-days: 30
  candidate:
    needs: [candidate-build, baseline]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theme: [neutral, forest, space]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: visual-next-build
          path: dist-visual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: visual-baseline-${{ matrix.theme }}
          path: .reference
      - name: Capture migrated real settings and gameplay
        env:
          UI_THEME: ${{ matrix.theme }}
          UI_DIST_ROOT: dist-visual
          VISUAL_CAPTURE_OUTPUT: ui-smoke/migration
        run: node scripts/capture-visual-baseline.mjs
      - name: Compare immutable before and after images
        env:
          UI_THEME: ${{ matrix.theme }}
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/compare-visual-captures.py ".reference/ui-smoke/baseline/$UI_THEME" "ui-smoke/migration/$UI_THEME" "ui-smoke/comparison/$UI_THEME" --expected 125
      - name: Exercise standalone visual compositions
        env:
          UI_THEME: ${{ matrix.theme }}
        run: node scripts/verify-visual-next-browser.mjs
      - name: Verify current games still preserve settings behavior
        env:
          UI_THEME: ${{ matrix.theme }}
          UI_DIST_ROOT: dist-visual
        run: |
          node scripts/verify-settings-browser.mjs
          node scripts/verify-dialogs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison-report-${{ matrix.theme }}
          path: ui-smoke/comparison/**/*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-next-${{ matrix.theme }}
          path: ui-smoke/
          retention-days: 30
