name: Modular library integration rehearsal
on:
  push:
    branches: [refactor/library-modular-integration-20261126]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run storage and editorial unit tests
        run: node --experimental-strip-types --test tests/library-storage-audit.test.ts tests/library-storage-optimize.test.ts tests/library-store.test.ts tests/library-toolkit.test.ts tests/library-index.test.ts tests/library-request.test.ts tests/library-source.test.ts tests/library-analysis-writer.test.ts tests/library-initial-analysis.test.ts tests/library-sqlite.test.ts tests/library-modular-request.test.ts
      - name: Inventory direct consumers
        run: node scripts/library-consumer-audit.cjs "$RUNNER_TEMP/consumer-audit.json"
      - name: Rehearse migration and candidate update on real source
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore -- outputs/library-v2.json' EXIT
          node scripts/check-library-v2.cjs
          node scripts/library-store.cjs init outputs/library-v2.json "$RUNNER_TEMP/modules"
          node scripts/library-store.cjs inspect "$RUNNER_TEMP/modules"
          node scripts/library-store.cjs export "$RUNNER_TEMP/modules" "$RUNNER_TEMP/rebuilt.json"
          node -e 'const fs=require("fs"),a=require("node:assert/strict");a.equal(JSON.stringify(JSON.parse(fs.readFileSync("outputs/library-v2.json"))),JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1]))))' "$RUNNER_TEMP/rebuilt.json"
          node scripts/library-storage-optimize.cjs "$RUNNER_TEMP/storage-check"
          node scripts/library-archive-guard.cjs
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-archive-guard.cjs
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/check-library-v2.cjs
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-toolkit.cjs select --weight 100 --limit 1 > "$RUNNER_TEMP/module-query.json"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" python3 -c 'import sys;sys.path.insert(0,"scripts");from library_source import read_library;import json;assert read_library()==json.load(open("outputs/library-v2.json"))'
          node scripts/export-library.cjs
          sha256sum public/library.json public/semantic-graph.json public/grammar-frames.json > "$RUNNER_TEMP/runtime-before.sha"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/export-library.cjs
          sha256sum -c "$RUNNER_TEMP/runtime-before.sha"
          git restore -- public/semantic-graph.json public/grammar-frames.json
          if git ls-files --error-unmatch public/library.json >/dev/null 2>&1; then git restore -- public/library.json; else rm -f public/library.json; fi
          node -e 'const fs=require("fs"),s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]);const e=r.db.entries.find(x=>x.kind==="word"&&!Object.hasOwn(x,"toolkit_validation_probe"));fs.writeFileSync(process.argv[2],JSON.stringify({version:1,source_sha256:r.source_sha256,operations:[{id:e.id,path:"/toolkit_validation_probe",expect:{exists:false},value:"disposable CI test only"}]}))' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/packet.json"
          node scripts/library-store.cjs patch "$RUNNER_TEMP/modules" "$RUNNER_TEMP/packet.json" "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/patch-result.json"
          cat "$RUNNER_TEMP/patch-result.json"
          # A real archived entry may receive an active grammar correction without rewriting history.
          node -e 'const fs=require("fs"),s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]);const e=r.db.entries.find(x=>x.legacy_source?.raw&&x.morphology?.data&&typeof x.morphology.data==="object"&&!Array.isArray(x.morphology.data)&&!Object.hasOwn(x.morphology.data,"toolkit_validation_probe"));if(!e)throw Error("No suitable archived entry");fs.writeFileSync(process.argv[2],JSON.stringify({version:1,source_sha256:r.source_sha256,operations:[{id:e.id,path:"/morphology/data/toolkit_validation_probe",expect:{exists:false},value:"disposable active correction probe"}]}))' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/archive-packet.json"
          node scripts/library-store.cjs patch "$RUNNER_TEMP/modules" "$RUNNER_TEMP/archive-packet.json" "$RUNNER_TEMP/archive-candidate" > "$RUNNER_TEMP/archive-patch-result.json"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/archive-candidate" node scripts/check-library-v2.cjs
          node -e 'const s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]);r.db.entries.find(e=>e.legacy_source?.raw).legacy_source.raw.toolkit_validation_probe="archive mutation must fail";s.create(process.argv[2],r.db)' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/corrupt-archive"
          if ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/corrupt-archive" node scripts/check-library-v2.cjs > "$RUNNER_TEMP/archive-rejection.log" 2>&1; then echo "Archive corruption unexpectedly accepted"; exit 1; fi
          grep -F 'Immutable historical archive changed' "$RUNNER_TEMP/archive-rejection.log"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/build-library-index.cjs "$RUNNER_TEMP/module-index"
          node scripts/build-library-index.cjs "$RUNNER_TEMP/legacy-index"
          node -e 'const fs=require("fs"),path=require("path"),a=require("node:assert/strict");const [m,l]=process.argv.slice(1);function walk(dir,p=""){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(path.join(dir,x.name),p+x.name+"/"):[p+x.name]).sort()}const names=walk(m);a.deepEqual(names,walk(l));for(const n of names){if(n==="manifest.json")continue;a.deepEqual(fs.readFileSync(path.join(m,n)),fs.readFileSync(path.join(l,n)),n)}console.log("Identical index data pages:",names.length-1)' "$RUNNER_TEMP/module-index" "$RUNNER_TEMP/legacy-index"
          node scripts/library-store.cjs export "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/candidate.json"
          cp "$RUNNER_TEMP/candidate.json" outputs/library-v2.json
          node scripts/check-library-v2.cjs
          git restore -- outputs/library-v2.json
          git diff --exit-code
      - name: Verify restricted analyzer writer against real modular data
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]);const e=r.db.entries.find(e=>e.morphology?.status==="automatic_candidate_needs_review"&&e.morphology?.data?.automatic_proposal?.status==="suggested"&&e.morphology.data.automatic_proposal.source==="pymorphy3"&&e.morphology.data.automatic_proposal.usable_for_generation===false&&e.morphology.data.automatic_proposal.forms&&!Object.hasOwn(e.morphology.data.automatic_proposal.forms,"toolkit_probe"));if(!e)throw Error("No suitable proposal");const p=e.morphology.data.automatic_proposal;p.forms.toolkit_probe=e.lemma.replace(/\s/g,"");p.extended_by="pymorphy3-expanded-paradigms-20261123-v1";fs.writeFileSync(process.argv[2],JSON.stringify(r.db));fs.writeFileSync(process.argv[3],r.source_sha256)' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/analysis-probe.json" "$RUNNER_TEMP/analysis-sha"
          node scripts/library-analysis-writer.cjs "$RUNNER_TEMP/modules" "$(cat "$RUNNER_TEMP/analysis-sha")" "$RUNNER_TEMP/analysis-probe.json" "$RUNNER_TEMP/analysis-candidate" > "$RUNNER_TEMP/analysis-candidate-report.json"
          cat "$RUNNER_TEMP/analysis-candidate-report.json"
          git diff --exit-code
      - name: Run existing morphology expansion in review mode on modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pymorphy3==2.0.6
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" python3 scripts/extend-morphology-20261123.py --report "$RUNNER_TEMP/morphology-review.json" --candidate-dir "$RUNNER_TEMP/morphology-candidate"
          git diff --exit-code
      - name: Generate bounded fresh analysis and stage initial candidates
        shell: bash
        run: |
          set -euo pipefail
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" python3 scripts/analyze-pending-words.py --morphology-only --initial-only --limit 20 --output "$RUNNER_TEMP/fresh-analysis.json" --report "$RUNNER_TEMP/fresh-analysis.md"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/merge-auto-analysis.cjs "$RUNNER_TEMP/fresh-analysis.json" "$RUNNER_TEMP/initial-candidate" > "$RUNNER_TEMP/initial-analysis-result.json"
          cat "$RUNNER_TEMP/initial-analysis-result.json"
          node -e 'const fs=require("fs"),s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]),a=require("node:assert/strict");const d=JSON.parse(fs.readFileSync(process.argv[2]));a.equal(d.source.sha256,r.source_sha256);a(d.entries.length<=20);const p=require("./scripts/library-initial-analysis.cjs");a.throws(()=>p.plan(r.db,{...d,source:{sha256:"stale"}},r.source_sha256),/Stale/)' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/fresh-analysis.json"
          git diff --exit-code
      - name: Build and verify derived SQLite search index
        shell: bash
        run: |
          set -euo pipefail
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-sqlite.cjs build "$RUNNER_TEMP/library.sqlite" > "$RUNNER_TEMP/sqlite-report.json"
          cat "$RUNNER_TEMP/sqlite-report.json"
          echo '{"weight":100,"sounds":["к"],"exclude_sounds":["р","р\u0027"],"has_image":true,"limit":10}' > "$RUNNER_TEMP/sqlite-request.json"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-sqlite.cjs query "$RUNNER_TEMP/library.sqlite" "$RUNNER_TEMP/sqlite-request.json" > "$RUNNER_TEMP/sqlite-result.json"
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1])),a=require("node:assert/strict");a(r.total>0);a(r.rows.length<=10);a(r.rows.every(x=>x.weight===100&&x.illustrations>0));console.log("Combined query total:",r.total)' "$RUNNER_TEMP/sqlite-result.json"
          if ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/candidate" node scripts/library-sqlite.cjs query "$RUNNER_TEMP/library.sqlite" "$RUNNER_TEMP/sqlite-request.json" > "$RUNNER_TEMP/sqlite-stale.log" 2>&1; then echo "Stale index accepted"; exit 1; fi
          grep -F 'Stale index' "$RUNNER_TEMP/sqlite-stale.log"
          git diff --exit-code
      - name: Exercise remote SQLite query protocol
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),q=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify({version:1,mode:"query",command:"sqlite",options:q}))' "$RUNNER_TEMP/sqlite-request.json" "$RUNNER_TEMP/remote-sqlite-request.json"
          ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-request.cjs "$RUNNER_TEMP/remote-sqlite-request.json" "$RUNNER_TEMP/remote-sqlite-result.json"
          node -e 'const fs=require("fs"),a=require("node:assert/strict"),r=JSON.parse(fs.readFileSync(process.argv[1])),d=JSON.parse(fs.readFileSync(process.argv[2]));a.equal(r.total,d.total);a.equal(r.source_sha256,d.source_sha256);a.deepEqual(r.rows.map(x=>x.id),d.rows.map(x=>x.id));a.equal(r.source_mode,"modules");console.log("Remote query matches local:",r.total)' "$RUNNER_TEMP/remote-sqlite-result.json" "$RUNNER_TEMP/sqlite-result.json"
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1]));r.source_sha256="0".repeat(64);fs.writeFileSync(process.argv[2],JSON.stringify(r))' "$RUNNER_TEMP/remote-sqlite-request.json" "$RUNNER_TEMP/remote-stale-request.json"
          if ZABAVOGRAD_LIBRARY_MODULES="$RUNNER_TEMP/modules" node scripts/library-request.cjs "$RUNNER_TEMP/remote-stale-request.json" "$RUNNER_TEMP/remote-stale-result.json"; then echo "Stale remote request accepted"; exit 1; fi
          test ! -e "$RUNNER_TEMP/remote-stale-result.json"
          git diff --exit-code
      - name: Verify remote preview and candidate bundle on real library
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"),s=require("./scripts/library-store.cjs"),r=s.load(process.argv[1]),e=r.db.entries.find(x=>x.id==="ru-home-20261105-bd699907");if(e?.selection.base_weight!==100)throw Error("Probe changed");fs.writeFileSync(process.argv[2],JSON.stringify({version:1,mode:"preview",source_sha256:r.source_sha256,operations:[{id:e.id,path:"/selection/base_weight",expect:{exists:true,value:100},value:70}]}))' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/edit-preview.json"
          node scripts/library-modular-request.cjs "$RUNNER_TEMP/modules" "$RUNNER_TEMP/edit-preview.json" "$RUNNER_TEMP/edit-preview-output"
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1]));fs.writeFileSync(process.argv[2],JSON.stringify({version:1,mode:"candidate",source_sha256:r.source_sha256,preview_sha256:r.preview_sha256,operations:r.operations}))' "$RUNNER_TEMP/edit-preview-output/result.json" "$RUNNER_TEMP/edit-candidate.json"
          node scripts/library-modular-request.cjs "$RUNNER_TEMP/modules" "$RUNNER_TEMP/edit-candidate.json" "$RUNNER_TEMP/edit-candidate-output"
          node -e 'const fs=require("fs"),path=require("path"),a=require("node:assert/strict"),s=require("./scripts/library-store.cjs"),[src,out,dest]=process.argv.slice(1),r=JSON.parse(fs.readFileSync(path.join(out,"result.json")));a.equal(r.status,"validated_candidate_not_approved");a.equal(r.changes.length,1);fs.cpSync(src,dest,{recursive:true});for(const f of r.bundle.removed_files)fs.unlinkSync(path.join(dest,f));for(const f of ["manifest.json",...r.bundle.changed_files]){const target=path.join(dest,f);fs.mkdirSync(path.dirname(target),{recursive:true});fs.copyFileSync(path.join(out,"delta",f),target)}const candidate=s.load(dest);a.equal(candidate.source_sha256,r.result_source_sha256);a.equal(candidate.db.entries.find(e=>e.id===r.changes[0].id).selection.base_weight,70);a.equal(s.load(src).db.entries.find(e=>e.id===r.changes[0].id).selection.base_weight,100);console.log("Verified reconstructable delta:",r.bundle.changed_files)' "$RUNNER_TEMP/modules" "$RUNNER_TEMP/edit-candidate-output" "$RUNNER_TEMP/reconstructed-edit"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: library-integration-rehearsal
          path: |
            ${{ runner.temp }}/consumer-audit.json
            ${{ runner.temp }}/patch-result.json
            ${{ runner.temp }}/archive-patch-result.json
            ${{ runner.temp }}/archive-rejection.log
            ${{ runner.temp }}/analysis-candidate-report.json
            ${{ runner.temp }}/morphology-review.json
            ${{ runner.temp }}/fresh-analysis.json
            ${{ runner.temp }}/initial-analysis-result.json
            ${{ runner.temp }}/library.sqlite
            ${{ runner.temp }}/sqlite-report.json
            ${{ runner.temp }}/sqlite-result.json
            ${{ runner.temp }}/remote-sqlite-result.json
            ${{ runner.temp }}/edit-preview-output
            ${{ runner.temp }}/edit-candidate-output
            ${{ runner.temp }}/modules
            ${{ runner.temp }}/storage-check/optimization.json
          retention-days: 14
