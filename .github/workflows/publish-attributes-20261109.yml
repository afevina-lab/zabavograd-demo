name: Publish adjectives and adverbs to main and live gh-pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-attributes-20261109.yml'
      - 'scripts/publish-attributes-20261109.py'
      - 'docs/attribute-lexicon-20261109.json'
      - 'docs/attribute-edges-20261109.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-attributes-20261109
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish and verify words and semantic relations on each branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/publish-attributes-20261109.py /tmp/attribute-publish.py
          cp docs/attribute-lexicon-20261109.json /tmp/attribute-lexicon.json
          cp docs/attribute-edges-20261109.json /tmp/attribute-edges.json
          for target in main gh-pages; do
            success=0
            for attempt in 1 2 3; do
              git fetch origin "$target"
              git switch -C "publish-attr-$target" "origin/$target"
              python3 /tmp/attribute-publish.py \
                --library library.json --graph semantic-graph.json \
                --spec /tmp/attribute-lexicon.json --edges /tmp/attribute-edges.json
              git add library.json semantic-graph.json
              if git diff --cached --quiet; then
                success=1
                break
              fi
              git commit -m "Publish 181 curated adjectives and adverbs with reverse semantic links"
              if git push origin "HEAD:$target"; then
                success=1
                break
              fi
            done
            test "$success" -eq 1 || { echo "Could not update $target" >&2; exit 1; }
          done
