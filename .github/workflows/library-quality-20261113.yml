name: Review useful vocabulary and taxonomy
on:
  push:
    branches: [main]
    paths: ['scripts/review-library-quality-20261113.cjs', '.github/workflows/library-quality-20261113.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-ui-release
  cancel-in-progress: false
jobs:
  review:
    # Historical migration retained for audit; delivery belongs to visual-publish.yml.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-package-lock
      - run: node scripts/review-library-quality-20261113.cjs
      - run: npm run library:refresh
      - run: npm run check:library && node scripts/verify-consolidated-library.cjs
      - run: npm test && npm run check:design-system && npm run build
      - run: node scripts/check-offline-release.cjs dist
      - name: Guard against thematic regressions
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),d=require('./outputs/library-v2.json'),r=require('./public/library.json');
          assert(!r.some(e=>e.categories.some(c=>c.includes('/Прочее'))));
          const bone=r.find(e=>e.meaning==='кость для собаки');assert(bone&&!bone.categories.some(c=>c.includes('Домашние животные')));
          const smoke=r.find(e=>e.label==='дым');assert(smoke);assert.equal(smoke.type,3);for(const s of ['д','ы','м'])assert(smoke.sounds[s]?.length);
          for(const name of ['белый гриб','лисичка','бледная поганка'])assert(r.find(e=>e.label===name)?.categories.includes('Растительный мир и грибы/Грибы'));
          for(const e of d.entries)for(const c of e.categories)assert(d.categories.some(x=>x.path===c.path));
          JS
      - name: Save verified source and generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/memory.test.ts outputs/library-v2.json scripts/check-library-v2.cjs docs/library-quality-20261113.json library.json semantic-graph.json public/semantic-graph.json public/grammar-frames.json outputs/Библиотека.html
          if ! git diff --cached --quiet; then
            git commit -m 'Review themes and add 12 purposeful everyday words'
            git push origin HEAD:main
          fi
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _published
      - name: Publish checked library
        run: |
          cp public/library.json _published/library.json
          cp public/semantic-graph.json _published/semantic-graph.json
          cp public/grammar-frames.json _published/grammar-frames.json
          git -C _published config user.name 'github-actions[bot]'
          git -C _published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _published add library.json semantic-graph.json grammar-frames.json
          if ! git -C _published diff --cached --quiet; then
            git -C _published commit -m 'Publish reviewed themes and useful vocabulary'
            git -C _published push origin HEAD:gh-pages
          fi

