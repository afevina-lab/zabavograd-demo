name: Risk-based validation (no deployment)
on:
  push:
    branches: [ci/risk-based-checks-20261124]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [AUTO, FAST, TARGETED, FULL]
        default: AUTO
permissions:
  contents: read
concurrency:
  group: ci-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.plan.outputs.themes }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache downloaded tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ci-tools-${{ runner.os }}-${{ hashFiles('package.json', 'scripts/prepare-card-skins.py') }}
      - name: Select safe scope
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'AUTO' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          git diff --name-only "$base" HEAD -z > /tmp/changed-paths
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/changed.json',JSON.stringify(fs.readFileSync('/tmp/changed-paths','utf8').split('\0').filter(Boolean)))"
          node scripts/ci-plan.mjs /tmp/changed.json "$REQUESTED_MODE" > ci-plan.json
          node -e "const p=require('./ci-plan.json');console.log('themes='+JSON.stringify(p.themes));console.log('mode='+p.mode)" >> "$GITHUB_OUTPUT"
          cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Install tools
        run: |
          npm install --no-package-lock --ignore-scripts
          python -m pip install --disable-pip-version-check pillow
      - name: Mandatory checks (each once)
        run: |
          node scripts/check-architecture.cjs
          node scripts/sync-runtime.cjs
          node scripts/check-library-v2.cjs
          node scripts/check-design-system.cjs
          node --experimental-strip-types --test tests/*.test.ts tests/ci-plan.test.mjs
          ./node_modules/.bin/tsc --noEmit
      - name: Build once and validate offline resources
        run: |
          ./node_modules/.bin/vite build
          python scripts/prepare-card-skins.py dist
          node scripts/check-offline-release.cjs dist
          printf '%s' "$GITHUB_SHA" > source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: validated-build-${{ github.sha }}
          path: |
            dist/
            ci-plan.json
            source.sha
          retention-days: 7
  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theme: ${{ fromJSON(needs.build.outputs.themes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: validated-build-${{ github.sha }}
      - name: Verify artifact identity
        run: test "$(cat source.sha)" = "$GITHUB_SHA"
      - name: Critical routes and resources
        env:
          UI_THEME: ${{ matrix.theme }}
        run: node scripts/verify-critical-browser.mjs
      - name: Targeted settings regressions
        if: needs.build.outputs.mode == 'TARGETED'
        env:
          UI_THEME: ${{ matrix.theme }}
          CI_PLAN_FILE: ci-plan.json
        run: node scripts/verify-settings-browser.mjs
      - name: Full settings and gameplay regressions
        if: needs.build.outputs.mode == 'FULL'
        env:
          UI_THEME: ${{ matrix.theme }}
        run: |
          node scripts/verify-settings-browser.mjs
          node scripts/verify-dialogs-browser.mjs
      - name: Shared geometry once
        if: needs.build.outputs.mode == 'FULL' && matrix.theme == 'neutral'
        run: GEOMETRY_ONLY=1 node scripts/verify-dialogs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.theme }}-${{ github.sha }}
          path: ui-smoke/
          if-no-files-found: ignore
          retention-days: 7
