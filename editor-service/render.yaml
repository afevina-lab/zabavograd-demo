services:
  - type: web
    name: zabavograd-library-editor
    runtime: docker
    dockerfilePath: ./editor-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: EDITOR_ORIGIN
        value: https://afevina-lab.github.io
      - key: EDITOR_URL
        value: https://afevina-lab.github.io/zabavograd-demo/editor/
