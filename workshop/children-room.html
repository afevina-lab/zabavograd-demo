<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детская комната</title><style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#f1d3a7}button{position:fixed;right:12px;top:12px;background:#fff9;border:1px solid #baa080;border-radius:8px;padding:8px 12px;color:#63482f;cursor:pointer}</style><div id="scene"></div><button id="motion">Пауза</button><script type="module">import {mountLocation} from './src/scene-engine/locations.mjs?v=20261128-animation';let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const el=document.getElementById('scene'),button=document.getElementById('motion');let scene;function start(){scene?.destroy();scene=mountLocation(el,'children-room',{base:new URL('./',location.href).href,reducedMotion:reduced});button.textContent=reduced?'Включить анимацию':'Пауза';}button.onclick=()=>{reduced=!reduced;start();};start();</script></html>
